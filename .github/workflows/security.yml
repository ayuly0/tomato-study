name: DevSecOps & Security Scans

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 02:00 UTC

jobs:
  security-audit:
    name: Dependency Audit & SAST Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and dev dependencies
        run: |
          uv sync --all-groups

      - name: Run pip-audit for dependency vulnerability scan
        run: |
          uv run pip-audit --desc on

      - name: Run Bandit for static application security testing (SAST)
        run: |
          uv run bandit -r src/ -ll -ii
