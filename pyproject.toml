[project]
name = "tomato-study"
version = "0.1.0"
description = "A modern Pomodoro and Flowtime focus timer built with PySide6 and Qt Quick"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.6.0",
    "cryptography>=42.0.0",
    "qtawesome>=1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.0",
]
